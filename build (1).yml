name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Create Android project and build APK
        run: |
          set -e
          mkdir -p build_project
          cd build_project
          cat > settings.gradle <<'PADELEOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "PadelTournaments"
          include ':app'
          PADELEOF
          cat > build.gradle <<'PADELEOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          PADELEOF
          cat > gradle.properties <<'PADELEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          PADELEOF
          mkdir -p app
          cat > app/build.gradle <<'PADELEOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.padel.tournaments'
              compileSdk 34

              defaultConfig {
                  applicationId "com.padel.tournaments"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          PADELEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'PADELEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Padel">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          PADELEOF
          mkdir -p app/src/main/java/com/padel/tournaments
          cat > app/src/main/java/com/padel/tournaments/MainActivity.java <<'PADELEOF'
          package com.padel.tournaments;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.webkit.WebViewAssetLoader;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);          // keeps saved tournaments between launches
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);

                  // Serve the bundled page from a https origin so localStorage is stable.
                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if ("appassets.androidplatform.net".equals(u.getHost())) return false;
                          startActivity(new Intent(Intent.ACTION_VIEW, u));
                          return true;
                      }
                  });

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
              }
          }
          PADELEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'PADELEOF'
          <resources>
              <string name="app_name">Padel Tournaments</string>
          </resources>
          PADELEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'PADELEOF'
          <resources>
              <style name="Theme.Padel" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#1C4D8F</item>
                  <item name="android:navigationBarColor">#1C4D8F</item>
                  <item name="android:windowBackground">#EEF2F6</item>
              </style>
          </resources>
          PADELEOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'PADELEOF'
          <resources>
              <color name="ic_background">#1C4D8F</color>
          </resources>
          PADELEOF
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'PADELEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_background" />
              <foreground android:drawable="@drawable/ic_foreground" />
          </adaptive-icon>
          PADELEOF
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/ic_foreground.xml <<'PADELEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- court lines -->
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#66FFFFFF"
                  android:strokeWidth="1.5"
                  android:pathData="M54,30 L54,78 M30,60 L78,60" />
              <!-- ball -->
              <path
                  android:fillColor="#D7E23A"
                  android:pathData="M54,54m-17,0a17,17 0,1 1,34 0a17,17 0,1 1,-34 0" />
              <!-- ball seams -->
              <path
                  android:fillColor="#00000000"
                  android:strokeColor="#FFFFFF"
                  android:strokeWidth="2"
                  android:strokeLineCap="round"
                  android:pathData="M40,45 C47,52 47,56 40,63 M68,45 C61,52 61,56 68,63" />
          </vector>
          PADELEOF
          mkdir -p app/src/main/assets
          cp ../index.html app/src/main/assets/index.html
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Padel-Tournaments.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Padel-Tournaments-APK
          path: Padel-Tournaments.apk
